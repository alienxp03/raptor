<main>
<h1>Raptor · Native macOS showcase</h1>
<p class="intro">Fictional names and data, rendered with the demo backend. No live Rex sessions or Git worktrees were touched.</p>
<div class="grid">
<figure><img src="search.png" alt="Searching sessions and directories"><figcaption><h2>Search and switch</h2><p>Filter open sessions and project directories, then open the selected result in a new session or another target.</p></figcaption></figure>
<figure><img src="sessions.png" alt="Pinned sessions and directories"><figcaption><h2>Pinned sessions</h2><p>Fixed shortcut slots make favorite sessions quick to reach across Rex.</p></figcaption></figure>
<figure><img src="worktrees.png" alt="Worktrunk-managed worktrees"><figcaption><h2>Worktrunk worktrees</h2><p>Browse a repository’s primary checkout and its feature branches.</p></figcaption></figure>
<figure><img src="worktree-create.png" alt="Create a worktree and choose an agent"><figcaption><h2>Create and launch</h2><p>Preview the branch and destination, choose where to open it, and optionally launch an agent.</p></figcaption></figure>
<figure><img src="delete-review.png" alt="Safety review before deleting worktrees"><figcaption><h2>Safe deletion</h2><p>Review checks, primary checkout locks, and force warnings before confirming removal.</p></figcaption></figure>
<figure><img src="pull-request.png" alt="Pull request checkout preview"><figcaption><h2>Pull requests</h2><p>Preview a PR’s branch and destination before opening it in a session.</p></figcaption></figure>
<figure><img src="split-mode.png" alt="Keyboard pane split selection"><figcaption><h2>Pane splits</h2><p>Choose the split direction from the keyboard.</p></figcaption></figure>
