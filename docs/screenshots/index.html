<main>
<h1>Raptor · Native macOS showcase</h1>
<p class="intro">System fonts and keyboard controls. Native views with synthetic project names, paths, and output.</p>
<div class="grid">
<figure><img src="directories.png" alt="Session and directory launcher"><figcaption><h2>Sessions and directories</h2><p>Resume a session or open a project. The default selection skips the current session when another destination is available.</p></figcaption></figure>
<figure><img src="split-mode.png" alt="Directional split selection"><figcaption><h2>Split mode</h2><p>Ctrl+P starts directional splitting. Use H/J/K/L or arrows; Escape cancels.</p></figcaption></figure>
<figure><img src="create-worktree.png" alt="New worktree form"><figcaption><h2>Create worktree</h2><p>Choose a branch and base, preview the destination, then create and open. Opening can be retried without creating again.</p></figcaption></figure>
</div>
<p>Mac and terminal interfaces share Go search, worktree creation, and Rex action logic. Synthetic renders do not change live sessions or Git worktrees.</p>
